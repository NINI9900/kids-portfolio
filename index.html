<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1e8"><title>Kids Design Portfolio</title><style>
:root{--bg:#f6f1e8;--ink:#191919;--muted:#79736a;--line:#d8d1c5}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}header{position:sticky;top:0;z-index:30;background:rgba(246,241,232,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top{padding:max(14px,env(safe-area-inset-top)) 14px 10px}.brand{font-size:21px;font-weight:900;letter-spacing:-.05em;margin-bottom:10px}.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid #242424;background:#fff;color:#171717;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;white-space:nowrap}.tab.on{background:#171717;color:#fff}main{max-width:1100px;margin:auto;padding:18px 12px 54px}.section{margin-bottom:42px}.sectionHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 3px 12px}.section h2{font-size:28px;letter-spacing:-.055em;margin:0}.count{font-size:12px;color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{margin:0;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:15px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.05);cursor:zoom-in}.card img{display:block;width:100%;height:auto;background:#fff}.card figcaption{padding:9px 10px 11px;font-size:12px;font-weight:800;letter-spacing:-.02em}.lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.96);align-items:center;justify-content:center;padding:54px 8px 24px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:calc(100dvh - 80px);object-fit:contain}.close{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;width:42px;height:42px;border:1px solid #666;border-radius:50%;background:#111;color:white;font-size:27px}.loading{padding:60px 20px;text-align:center;color:var(--muted)}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:15px}.section h2{font-size:34px}.brand{font-size:25px}}
</style></head><body><header><div class="top"><div class="brand">Kids Design Portfolio</div><div class="tabs" id="tabs"></div></div></header><main id="app"><div class="loading">Loading…</div></main><div class="lightbox" id="lb"><button class="close" id="close">×</button><img id="big"></div>
<script>window.PORTFOLIO_DATA=[];</script>
<script src="posters.js"></script><script src="stickers.js"></script><script src="backgrounds.js"></script><script src="letters.js"></script><script src="news.js"></script><script src="magazines.js"></script><script src="brochures.js"></script><script src="worksheets.js"></script>
<script>
const D=window.PORTFOLIO_DATA, order=["포스터","스티커","배경","편지지","어린이 영어신문","키즈 잡지","브로슈어","워크시트"],app=document.getElementById("app"),tabs=document.getElementById("tabs");
function render(active="전체"){app.innerHTML="";(active==="전체"?order:[active]).forEach(cat=>{const list=D.filter(x=>x.category===cat);if(!list.length)return;const s=document.createElement("section");s.className="section";s.innerHTML=`<div class="sectionHead"><h2>${cat}</h2><span class="count">${list.length} works</span></div><div class="grid"></div>`;const g=s.querySelector(".grid");list.forEach(it=>{const f=document.createElement("figure");f.className="card";f.innerHTML=`<img loading="lazy" decoding="async" src="${it.src}" alt="${it.title}"><figcaption>${it.title}</figcaption>`;f.onclick=()=>openBox(it.src);g.appendChild(f)});app.appendChild(s)})}
["전체",...order].forEach((x,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" on":"");b.textContent=x;b.onclick=()=>{document.querySelectorAll(".tab").forEach(v=>v.classList.remove("on"));b.classList.add("on");render(x);scrollTo({top:0,behavior:"smooth"})};tabs.appendChild(b)});
const lb=document.getElementById("lb"),big=document.getElementById("big");function openBox(src){big.src=src;lb.classList.add("open");document.body.style.overflow="hidden"}function closeBox(){lb.classList.remove("open");big.src="";document.body.style.overflow=""}document.getElementById("close").onclick=closeBox;lb.onclick=e=>{if(e.target===lb)closeBox()};render();
</script></body></html>
